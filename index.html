<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Remove warnings de lazy loading (comportamento esperado)
      const originalConsoleWarn = console.warn;
      console.warn = (...args) => {
        if (typeof args[0] === 'string' && (args[0].includes('lazy') || args[0].includes('Intervention'))) {
          return; // Silencia warnings de lazy loading
        }
        originalConsoleWarn.apply(console, args);
      };
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BarberX | Barbearia Premium | Agendamento Online</title>
    <meta name="description" content="BarberX Premium - Agende seu corte online. Sem filas, sem espera." />
    <meta name="keywords" content="barbearia, corte de cabelo masculino, barba, barbeiro, agendamento online, barber shop, fade, corte moderno" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BarberX Premium - Seu melhor visual começa aqui" />
    <meta property="og:description" content="Agende seu corte na BarberX em menos de 30 segundos. Atendimento premium e qualidade garantida." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=75&w=1200&auto=format&fit=crop" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarberX" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
  
    <!-- Theme Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var theme = savedTheme;
          if (!theme) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="antialiased bg-surface-base text-content-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
